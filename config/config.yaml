# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                      Version: 2.4.0
# ═══════════════════════════════════════════════════════════════

# 可视化配置编辑器地址: https://sansan0.github.io/TrendRadar/

# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  # 时区配置（影响所有时间显示、调度系统判断、数据存储）
  timezone: "Asia/Shanghai"
  show_version_update: true           # 是否显示版本更新提示

# ===============================================================
# 1.5 调度系统 —— 什么时间做什么事
# ===============================================================
schedule:
  enabled: false                      # 是否启用调度系统（通过 GitHub Actions 定时运行则不依赖此项）
  preset: "morning_evening"           # 预设模板名称

# ===============================================================
# 2. 数据源 - 热榜平台
# ===============================================================
platforms:
  enabled: true                       # 是否启用热榜平台抓取
  api_url: ""                         # 热榜数据 API 地址（留空使用默认地址）
  sources:
    # 保留的 A股核心快讯平台
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    # 新增：雪球热帖（捕捉散户与游资情绪，判断交易异动）
    - id: "xueqiu-hot"
      name: "雪球热帖"
      expected_domain: "xueqiu.com"

# ===============================================================
# 3. 数据源 - RSS 订阅
# ===============================================================
rss:
  enabled: true                       # 是否启用 RSS 抓取
  freshness_filter:
    enabled: true                     # 是否启用新鲜度过滤
    max_age_days: 1                   # 最大文章年龄：只保留 1 天内的最新资讯

  feeds:
    # 👇 替换后的 7 个财经与研报 RSS 源（已使用公网可用实例，适配 GitHub Actions）
    - id: "eastmoney-kuaixun"
      name: "东方财富-快讯"
      url: "https://rsshub.rssforever.com/eastmoney/report"
      
    - id: "ths-kuaixun"
      name: "同花顺-实时解盘"
      url: "https://rsshub.rssforever.com/10jqka/realtime"
      
    - id: "jin10-flash"
      name: "金十数据-全球宏观"
      url: "https://rsshub.rssforever.com/jin10"
      
    - id: "sina-finance"
      name: "新浪财经-滚动新闻"
      url: "https://rss.sina.com.cn/finance/roll.xml"
      
    - id: "yicai-news"
      name: "第一财经-最新资讯"
      url: "https://rsshub.rssforever.com/yicai/brief"
      
    - id: "jiemian-rss"
      name: "界面新闻-商业深度"
      url: "https://a.jiemian.com/index.php?m=article&a=rss"
      
    - id: "stcn-news"
      name: "证券时报-权威信披"
      url: "https://www.stcn.com/rss/news.xml"

# ===============================================================
# 4. 报告模式
# ===============================================================
report:
  mode: "current"                     # 报告模式（daily=当日汇总, current=当前榜单, incremental=增量）
  display_mode: "keyword"             # 分组维度：按关键词分组显示
  sort_by_position_first: false       # 关键词模式排序
  rank_threshold: 5                   # 排名高亮阈值
  max_news_per_keyword: 0             # 每个关键词/标签最大显示数量（0=不限制）

# ===============================================================
# 4.5 筛选策略
# ===============================================================
filter:
  method: "keyword"                   # 筛选方式：keyword（关键词匹配）/ ai（AI智能分类）
  priority_sort_enabled: true         # AI 模式标签排序

# ===============================================================
# 4.6 AI 智能筛选配置（仅 filter.method=ai 时生效）
# ===============================================================
ai_filter:
  batch_size: 200                     # 每批发送给 AI 的标题数
  batch_interval: 2                   # 分批间隔（秒）
  min_score: 0.7                      # 推送最低分数阈值
  reclassify_threshold: 0.6           # 全量重分类触发阈值
  prompt_file: "prompt.txt"
  extract_prompt_file: "extract_prompt.txt"
  update_tags_prompt_file: "update_tags_prompt.txt"

# ===============================================================
# 5. 推送内容控制
# ===============================================================
display:
  region_order:
    - new_items                       # 1️⃣ 新增热点区域
    - hotlist                         # 2️⃣ 热榜区域（关键词匹配 / AI 智能筛选）
    - rss                             # 3️⃣ RSS 订阅区域
    - standalone                      # 4️⃣ 独立展示区
    - ai_analysis                     # 5️⃣ AI 分析区域

  regions:
    hotlist: true                     # 热榜区域
    new_items: false                  # 新增热点区域
    rss: true                         # RSS 订阅区域（显示并分析）
    standalone: false                 # 独立展示区
    ai_analysis: true                 # AI 分析区域

  standalone:
    platforms: ["zhihu", "wallstreetcn-hot"]     # 独立展示的热榜
    rss_feeds: []                                # 独立展示的 RSS
    max_items: 20                                # 每个源最多展示条数

# ===============================================================
# 6. 推送通知
# ⚠️ 安全警告：webhook 地址不要公开！请填入 GitHub Secrets
# ===============================================================
notification:
  enabled: true                       # 总开关
  channels:
    feishu:
      webhook_url: ""                 # 飞书机器人 webhook URL
    dingtalk:
      webhook_url: ""                 # 钉钉机器人 webhook URL
    wework:
      webhook_url: ""                 # 企业微信机器人 webhook URL
      msg_type: "markdown"            # 消息类型
    telegram:
      bot_token: ""                   # Telegram Bot Token
      chat_id: ""                     # Telegram Chat ID
    email:
      from: ""                        # 发件人邮箱地址
      password: ""                    # 发件人邮箱密码或授权码
      to: ""                          # 收件人邮箱
      smtp_server: ""                 # SMTP 服务器
      smtp_port: ""                   # SMTP 端口
    ntfy:
      server_url: "https://ntfy.sh"   # ntfy 服务器地址
      topic: ""                       # ntfy 主题名称
      token: ""                       # ntfy 访问令牌
    bark:
      url: ""                         # Bark 推送 URL
    slack:
      webhook_url: ""                 # Slack Incoming Webhook URL
    generic_webhook:
      webhook_url: ""                 # 通用 Webhook URL
      payload_template: ""            # JSON 模板

# ===============================================================
# 7. 存储配置
# ===============================================================
storage:
  backend: "auto"                     # 存储后端：auto / local / remote
  formats:
    sqlite: true                      # 主存储（必须保持 true）
    txt: false                        # TXT 快照
    html: true                        # HTML 报告（必须 true 才能在网页看）
  
  local:
    data_dir: "output"                # 数据目录
    retention_days: 0                 # 保留天数（0=永久保留）

  remote:
    retention_days: 0                 # 保留天数
    endpoint_url: ""                  # 服务端点 (R2/OSS/COS)
    bucket_name: ""                   # 存储桶名称
    access_key_id: ""                 # 访问密钥 ID
    secret_access_key: ""             # 访问密钥
    region: ""                        # 区域

  pull:
    enabled: false                    # 是否启用启动时自动拉取
    days: 7                           # 拉取最近 N 天的数据

# ===============================================================
# 8. AI 模型配置（ai_analysis / ai_translation / ai_filter 共用）
# ===============================================================
ai:
  model: "deepseek/deepseek-v4-flash" # LiteLLM 模型格式
  api_key: ""                         # API Key（建议使用环境变量 AI_API_KEY）
  api_base: ""                        # 自定义 API 地址（留空即可）
  timeout: 120                        # 请求超时（秒）
  temperature: 1.0                    # 采样温度 (0.0-2.0)
  max_tokens: 5000                    # 最大生成 token 数
  num_retries: 1                      # 失败重试次数
  fallback_models: []                 # 备用模型列表

# ===============================================================
# 9. AI 分析功能
# ===============================================================
ai_analysis:
  enabled: true                       # 是否启用 AI 分析总开关
  language: "Chinese"                 # 分析报告语言
  prompt_file: "ai_analysis_prompt.txt" # 提示词文件
  mode: "follow_report"               # AI 分析模式
  max_news_for_analysis: 150          # 参与分析的新闻数量上限
  include_rss: false                  # 是否包含 RSS 内容进行分析
  include_standalone: true            # 是否纳入独立展示区数据
  include_rank_timeline: true         # 排名时间线详细程度

# ===============================================================
# 10. AI 翻译功能
# ===============================================================
ai_translation:
  enabled: true                       # 是否启用翻译功能
  language: "中文"                    # 翻译目标语言
  prompt_file: "ai_translation_prompt.txt" # 提示词文件
  batch_size: 100                     # 每批发送给 AI 的标题数
  batch_interval: 2                   # 分批间隔（秒）
  scope:
    hotlist: false                    # 翻译热榜标题
    rss: true                         # 翻译 RSS 标题
    standalone: true                  # 翻译独立展示区标题

# ===============================================================
# 11. 高级设置（一般无需修改）
# ===============================================================
advanced:
  debug: false                        # 调试模式
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"
  
  crawler:
    request_interval: 2000            # 请求间隔（毫秒）
    use_proxy: false                  # 是否启用代理
    default_proxy: "http://127.0.0.1:10801"
  
  rss:
    request_interval: 1000            # 请求间隔（毫秒）
    timeout: 15                       # 请求超时（秒）
    use_proxy: false                  # 是否使用代理
    proxy_url: ""                     # RSS 专属代理

  weight:
    rank: 0.6                         # 排名权重
    frequency: 0.3                    # 频次权重
    hotness: 0.1                      # 热度权重

  max_accounts_per_channel: 3         # 每个渠道最大账号数量
  batch_size:                         # 消息分批大小
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3              # 批次发送间隔（秒）
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
